name: Release

# Publishes to npm when a GitHub release is published.
# Set up npm "Trusted Publishing" for this repo and workflow (recommended, no token needed),
# or add an NPM_TOKEN repository secret.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json ($VERSION)"
            exit 1
          fi
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
